<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roastfolio · CI/CD</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..700;1,62..125,400..700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f7faf7;
      --color-paper-2: #e9f0eb;
      --color-ink:     #22306b;
      --color-muted:   #4c5a8f;
      --color-soft:    #7d88b0;
      --color-rule:    rgba(34,48,107,0.12);
      --color-accent:  #c4232b;
      --color-link:    #2f7d6b;
      --font-sans:     'Archivo', system-ui, sans-serif;
      --font-mono:     'Courier Prime', 'Courier New', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 960px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-weight: 700;
      font-stretch: 88%;
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem);
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 720px; display: block; }

    footer {
      margin-top: 1.25rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--color-rule);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-muted);
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">CI/CD · Roastfolio</p>
    <h1>De un push a main a producción</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cicd-title cicd-desc">
      <title id="cicd-title">CI/CD de Roastfolio con Cloud Build</title>
      <desc id="cicd-desc">Diagrama de flujo: un push a main en GitHub dispara el trigger de Cloud Build roastfolio-main, que corre tres suites de tests en paralelo, construye las imágenes de web y worker, las sube a Artifact Registry cuando todo está en verde, despliega ambos servicios de Cloud Run cambiando solo la imagen y publica el frontend en el bucket site.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4c5a8f"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c4232b"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f7d6b"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7faf7"/>

      <!-- ============ ZONE: parallel tests ============ -->
      <rect x="392" y="56" width="152" height="232" rx="8" fill="rgba(34,48,107,0.02)" stroke="rgba(34,48,107,0.16)" stroke-width="0.8"/>
      <rect x="400" y="60" width="112" height="12" rx="2" fill="#f7faf7"/>
      <text x="406" y="69" fill="#4c5a8f" font-size="8" font-family="'Courier Prime', monospace" letter-spacing="0.14em">TESTS EN PARALELO</text>

      <!-- ============ ARROWS ============ -->
      <!-- push → trigger -->
      <line x1="160" y1="184" x2="196" y2="184" stroke="#4c5a8f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- fork: trigger → 3 tests -->
      <path d="M 356,168 H 372 Q 380,168 380,160 V 120 Q 380,112 388,112 H 404" fill="none" stroke="#4c5a8f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="356" y1="184" x2="404" y2="184" stroke="#4c5a8f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 356,200 H 372 Q 380,200 380,208 V 248 Q 380,256 388,256 H 404" fill="none" stroke="#4c5a8f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- tests web / worker → images -->
      <line x1="532" y1="112" x2="572" y2="112" stroke="#4c5a8f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="532" y1="184" x2="572" y2="184" stroke="#4c5a8f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- join: images + frontend test → merge dot -->
      <line x1="632" y1="208" x2="632" y2="252" stroke="#4c5a8f" stroke-width="1.2"/>
      <line x1="532" y1="256" x2="628" y2="256" stroke="#4c5a8f" stroke-width="1.2"/>
      <!-- merge → Artifact Registry -->
      <line x1="636" y1="256" x2="736" y2="256" stroke="#4c5a8f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- AR → deploy → publish -->
      <line x1="828" y1="292" x2="828" y2="324" stroke="#4c5a8f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="828" y1="396" x2="828" y2="428" stroke="#4c5a8f" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ ARROW LABELS ============ -->
      <rect x="648" y="236" width="76" height="12" rx="2" fill="#f7faf7"/>
      <text x="686" y="245" fill="#4c5a8f" font-size="8" font-family="'Courier Prime', monospace" text-anchor="middle" letter-spacing="0.02em">todo en verde</text>

      <!-- ============ NODES ============ -->
      <!-- Start: git push -->
      <rect x="40" y="160" width="120" height="48" rx="20" fill="#f7faf7"/>
      <rect x="40" y="160" width="120" height="48" rx="20" fill="rgba(76,90,143,0.10)" stroke="#7d88b0" stroke-width="1"/>
      <text x="100" y="182" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">git push main</text>
      <text x="100" y="197" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">GitHub</text>

      <!-- Trigger (focal) -->
      <rect x="196" y="140" width="160" height="88" rx="6" fill="#f7faf7"/>
      <rect x="196" y="140" width="160" height="88" rx="6" fill="rgba(196,35,43,0.07)" stroke="#c4232b" stroke-width="1.2"/>
      <rect x="204" y="146" width="44" height="12" rx="2" fill="transparent" stroke="rgba(196,35,43,0.50)" stroke-width="0.8"/>
      <text x="226" y="155" fill="#c4232b" font-size="7" font-family="'Courier Prime', monospace" text-anchor="middle" letter-spacing="0.08em">TRIGGER</text>
      <text x="276" y="178" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Cloud Build</text>
      <text x="276" y="193" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">roastfolio-main</text>
      <text x="276" y="205" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">rf-github · 2nd gen</text>
      <text x="276" y="217" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">corre como sa-build</text>

      <!-- Tests -->
      <rect x="404" y="88" width="128" height="48" rx="6" fill="#f7faf7"/>
      <rect x="404" y="88" width="128" height="48" rx="6" fill="#ffffff" stroke="#22306b" stroke-width="1"/>
      <text x="468" y="108" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">pytest · web</text>
      <text x="468" y="123" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">uv · Python 3.12</text>

      <rect x="404" y="160" width="128" height="48" rx="6" fill="#f7faf7"/>
      <rect x="404" y="160" width="128" height="48" rx="6" fill="#ffffff" stroke="#22306b" stroke-width="1"/>
      <text x="468" y="180" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">pytest · worker</text>
      <text x="468" y="195" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">uv · Python 3.12</text>

      <rect x="404" y="232" width="128" height="48" rx="6" fill="#f7faf7"/>
      <rect x="404" y="232" width="128" height="48" rx="6" fill="#ffffff" stroke="#22306b" stroke-width="1"/>
      <text x="468" y="252" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">vitest + build</text>
      <text x="468" y="267" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">Node 24 · frontend</text>

      <!-- Build images -->
      <rect x="572" y="88" width="120" height="120" rx="6" fill="#f7faf7"/>
      <rect x="572" y="88" width="120" height="120" rx="6" fill="#ffffff" stroke="#22306b" stroke-width="1"/>
      <rect x="580" y="94" width="40" height="12" rx="2" fill="transparent" stroke="rgba(34,48,107,0.40)" stroke-width="0.8"/>
      <text x="600" y="103" fill="rgba(34,48,107,0.8)" font-size="7" font-family="'Courier Prime', monospace" text-anchor="middle" letter-spacing="0.08em">DOCKER</text>
      <text x="632" y="148" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Imágenes</text>
      <text x="632" y="163" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">web · worker</text>

      <!-- Merge dot -->
      <circle cx="632" cy="256" r="4" fill="#22306b"/>

      <!-- Artifact Registry -->
      <rect x="736" y="220" width="184" height="72" rx="6" fill="#f7faf7"/>
      <rect x="736" y="220" width="184" height="72" rx="6" fill="rgba(34,48,107,0.05)" stroke="#4c5a8f" stroke-width="1"/>
      <rect x="744" y="226" width="20" height="12" rx="2" fill="transparent" stroke="rgba(76,90,143,0.50)" stroke-width="0.8"/>
      <text x="754" y="235" fill="#4c5a8f" font-size="7" font-family="'Courier Prime', monospace" text-anchor="middle" letter-spacing="0.08em">AR</text>
      <text x="828" y="258" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Artifact Registry</text>
      <text x="828" y="272" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">:BUILD_ID + :latest</text>
      <text x="828" y="284" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">política de limpieza</text>

      <!-- Deploy Cloud Run -->
      <rect x="736" y="324" width="184" height="72" rx="6" fill="#f7faf7"/>
      <rect x="736" y="324" width="184" height="72" rx="6" fill="#ffffff" stroke="#22306b" stroke-width="1"/>
      <rect x="744" y="330" width="26" height="12" rx="2" fill="transparent" stroke="rgba(34,48,107,0.40)" stroke-width="0.8"/>
      <text x="757" y="339" fill="rgba(34,48,107,0.8)" font-size="7" font-family="'Courier Prime', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
      <text x="828" y="362" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Deploy en Cloud Run</text>
      <text x="828" y="376" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">worker y web</text>
      <text x="828" y="388" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">solo cambia la imagen</text>

      <!-- Publish site -->
      <rect x="736" y="428" width="184" height="88" rx="6" fill="#f7faf7"/>
      <rect x="736" y="428" width="184" height="88" rx="6" fill="rgba(34,48,107,0.05)" stroke="#4c5a8f" stroke-width="1"/>
      <rect x="744" y="434" width="26" height="12" rx="2" fill="transparent" stroke="rgba(76,90,143,0.50)" stroke-width="0.8"/>
      <text x="757" y="443" fill="#4c5a8f" font-size="7" font-family="'Courier Prime', monospace" text-anchor="middle" letter-spacing="0.08em">GCS</text>
      <text x="828" y="466" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Publicar sitio</text>
      <text x="828" y="480" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">frontend/dist → bucket site</text>
      <text x="828" y="492" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">assets/: 1 año, immutable</text>
      <text x="828" y="504" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">index.html: no-cache</text>

      <!-- Annotation beside deploy -->
      <line x1="700" y1="360" x2="732" y2="360" stroke="#7d88b0" stroke-width="0.8" stroke-dasharray="2,2"/>
      <text x="692" y="356" fill="#4c5a8f" font-size="11" font-style="italic" font-family="'Archivo', sans-serif" text-anchor="end">Variables, cuentas de servicio e ingress</text>
      <text x="692" y="371" fill="#4c5a8f" font-size="11" font-style="italic" font-family="'Archivo', sans-serif" text-anchor="end">no cambian: viven en la infraestructura.</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(34,48,107,0.12)" stroke-width="0.8"/>
      <text x="40" y="572" fill="#4c5a8f" font-size="8" font-family="'Courier Prime', monospace" letter-spacing="0.18em">LEYENDA</text>

      <rect x="120" y="563" width="14" height="10" rx="2" fill="rgba(196,35,43,0.07)" stroke="#c4232b" stroke-width="1"/>
      <text x="140" y="571" fill="#4c5a8f" font-size="9" font-family="'Archivo', sans-serif">Foco: trigger</text>

      <rect x="236" y="563" width="20" height="10" rx="5" fill="rgba(76,90,143,0.10)" stroke="#7d88b0" stroke-width="1"/>
      <text x="262" y="571" fill="#4c5a8f" font-size="9" font-family="'Archivo', sans-serif">Inicio</text>

      <rect x="324" y="563" width="14" height="10" rx="2" fill="#ffffff" stroke="#22306b" stroke-width="1"/>
      <text x="344" y="571" fill="#4c5a8f" font-size="9" font-family="'Archivo', sans-serif">Paso de build</text>

      <rect x="440" y="563" width="14" height="10" rx="2" fill="rgba(34,48,107,0.05)" stroke="#4c5a8f" stroke-width="1"/>
      <text x="460" y="571" fill="#4c5a8f" font-size="9" font-family="'Archivo', sans-serif">Publica un artefacto</text>

      <circle cx="588" cy="568" r="4" fill="#22306b"/>
      <text x="600" y="571" fill="#4c5a8f" font-size="9" font-family="'Archivo', sans-serif">Espera a que todo pase</text>
    </svg>

    <footer>cloudbuild.yaml · trigger roastfolio-main en us-central1 · historial en la consola de Cloud Build</footer>
  </div>
</body>
</html>
