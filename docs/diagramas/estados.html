<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roastfolio · Estados de un roast</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f7faf7;
      --color-paper-2: #e9f0eb;
      --color-ink:     #22306b;
      --color-muted:   #4c5a8f;
      --color-soft:    #7d88b0;
      --color-rule:    rgba(34,48,107,0.12);
      --color-accent:  #c4232b;
      --color-link:    #2f7d6b;
      --font-sans:     'Archivo', system-ui, sans-serif;
      --font-mono:     'Courier Prime', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.9rem);
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Estados · Ciclo de vida</p>
    <h1>Estados de un roast</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="estados-title estados-desc">
      <title id="estados-title">Roastfolio: estados de un roast</title>
      <desc id="estados-desc">Ciclo de vida de un roast: avanza de queued a extracting, roasting, rendering y done; un error reintentable pasa a un reintento de Cloud Tasks que retoma desde el último paso guardado sin volver a pagar, un error permanente o el cuarto intento fallido termina en failed, y a las 24 horas cualquier roast expira y la API responde 404.</desc>
      <defs>
        <marker id="estados-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4c5a8f"/>
        </marker>
        <marker id="estados-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#c4232b"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7faf7"/>

      <!-- BANDS (painted first) -->
      <rect x="24" y="32" width="912" height="136" rx="8" fill="rgba(76,90,143,0.035)" stroke="rgba(34,48,107,0.12)"/>
      <rect x="24" y="400" width="912" height="120" rx="8" fill="rgba(34,48,107,0.035)" stroke="rgba(34,48,107,0.12)"/>
      <g fill="#4c5a8f" font-size="8" font-family="'Courier Prime', monospace" font-weight="700" letter-spacing="0.14em">
        <text x="40" y="52">REINTENTO · CLOUD TASKS</text>
        <text x="40" y="200">FASES · status EN FIRESTORE</text>
        <text x="40" y="420">DESENLACES TERMINALES</text>
      </g>

      <!-- GROUP BRACKETS over / under extracting · roasting · rendering -->
      <g fill="none" stroke="#a9c2b4" stroke-width="1">
        <path d="M296 232 V212 H664 V232"/>
        <path d="M480 212 V232"/>
        <path d="M296 304 V324 H664 V304"/>
        <path d="M480 304 V324"/>
      </g>

      <!-- TRANSITIONS (drawn before states) -->
      <g fill="none" stroke="#4c5a8f" stroke-width="1.2">
        <line x1="176" y1="268" x2="232" y2="268" marker-end="url(#estados-arrow)"/>
        <line x1="360" y1="268" x2="416" y2="268" marker-end="url(#estados-arrow)"/>
        <line x1="544" y1="268" x2="600" y2="268" marker-end="url(#estados-arrow)"/>
        <line x1="728" y1="268" x2="784" y2="268" marker-end="url(#estados-arrow)"/>
        <!-- any step → retry -->
        <line x1="456" y1="212" x2="456" y2="136" marker-end="url(#estados-arrow)"/>
        <!-- any step → failed -->
        <line x1="480" y1="324" x2="480" y2="432" marker-end="url(#estados-arrow)"/>
        <!-- expiry (time-based) -->
        <line x1="848" y1="304" x2="848" y2="432" stroke-dasharray="5,4" marker-end="url(#estados-arrow)"/>
        <line x1="600" y1="468" x2="672" y2="468" stroke-dasharray="5,4" marker-end="url(#estados-arrow)"/>
      </g>
      <!-- retry → resume at last saved step (focal) -->
      <line x1="504" y1="136" x2="504" y2="212" stroke="#c4232b" stroke-width="1.4" marker-end="url(#estados-arrow-accent)"/>

      <!-- TRANSITION LABELS · opaque masks -->
      <g font-family="'Courier Prime', monospace" font-size="8" fill="#4c5a8f">
        <rect x="184" y="250" width="40" height="12" rx="2" fill="#f7faf7"/>
        <text x="204" y="259" text-anchor="middle">entrega</text>
        <rect x="366" y="250" width="44" height="12" rx="2" fill="#f7faf7"/>
        <text x="388" y="259" text-anchor="middle">+profile</text>
        <rect x="552" y="250" width="40" height="12" rx="2" fill="#f7faf7"/>
        <text x="572" y="259" text-anchor="middle">+result</text>
        <rect x="734" y="250" width="44" height="12" rx="2" fill="#f7faf7"/>
        <text x="756" y="259" text-anchor="middle">+tarjeta</text>

        <rect x="350" y="170" width="100" height="24" rx="2" fill="#f7faf7"/>
        <text x="446" y="179" text-anchor="end">error reintentable</text>
        <text x="446" y="190" text-anchor="end">worker responde 500</text>

        <rect x="510" y="176" width="136" height="24" rx="2" fill="#f7faf7"/>
        <text x="514" y="185" fill="#c4232b" font-weight="700">retoma del último paso</text>
        <text x="514" y="196" fill="#c4232b">guardado: no paga 2 veces</text>

        <rect x="362" y="356" width="110" height="24" rx="2" fill="#f7faf7"/>
        <text x="468" y="365" text-anchor="end">PermanentError</text>
        <text x="468" y="376" text-anchor="end">o falla el 4.º intento</text>

        <rect x="760" y="362" width="80" height="12" rx="2" fill="#f7faf7"/>
        <text x="836" y="371" text-anchor="end">24 h · expiresAt</text>

        <rect x="620" y="450" width="32" height="12" rx="2" fill="#f7faf7"/>
        <text x="636" y="459" text-anchor="middle">24 h</text>
      </g>

      <!-- PRIMARY RAIL: five phases -->
      <g text-anchor="middle">
        <g>
          <rect x="48" y="232" width="128" height="72" rx="8" fill="#ffffff" stroke="#22306b"/>
          <text x="112" y="258" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif">queued</text>
          <text x="112" y="275" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace">doc en Firestore</text>
          <text x="112" y="287" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace">tarea en la cola</text>
        </g>
        <g>
          <rect x="232" y="232" width="128" height="72" rx="8" fill="#ffffff" stroke="#22306b"/>
          <text x="296" y="258" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif">extracting</text>
          <text x="296" y="275" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace">Document AI / Apify</text>
          <text x="296" y="287" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace">Gemini normaliza</text>
        </g>
        <g>
          <rect x="416" y="232" width="128" height="72" rx="8" fill="#ffffff" stroke="#22306b"/>
          <text x="480" y="258" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif">roasting</text>
          <text x="480" y="275" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace">Gemini, JSON schema</text>
          <text x="480" y="287" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace">roast, score, tips</text>
        </g>
        <g>
          <rect x="600" y="232" width="128" height="72" rx="8" fill="#ffffff" stroke="#22306b"/>
          <text x="664" y="258" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif">rendering</text>
          <text x="664" y="275" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace">Nano Banana</text>
          <text x="664" y="287" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace">JPEG 1200×630</text>
        </g>
        <g>
          <rect x="784" y="232" width="128" height="72" rx="8" fill="rgba(196,35,43,0.07)" stroke="#c4232b"/>
          <circle cx="800" cy="248" r="6" fill="none" stroke="#c4232b"/>
          <circle cx="800" cy="248" r="3.5" fill="#c4232b"/>
          <text x="848" y="258" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif">done</text>
          <text x="848" y="275" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace">roast + certificado</text>
          <text x="848" y="287" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace">en bucket cards</text>
        </g>
      </g>

      <!-- RECOVERY STATE -->
      <g>
        <rect x="380" y="64" width="200" height="72" rx="8" fill="#f7faf7" stroke="#4c5a8f" stroke-dasharray="5,4"/>
        <rect x="390" y="72" width="40" height="12" rx="2" fill="none" stroke="rgba(76,90,143,0.45)" stroke-width="0.8"/>
        <text x="410" y="81" fill="#4c5a8f" font-size="7" font-family="'Courier Prime', monospace" text-anchor="middle" letter-spacing="0.08em">ESPERA</text>
        <text x="480" y="100" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Reintento</text>
        <text x="480" y="116" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">backoff · hasta 4 intentos</text>
        <text x="480" y="128" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">el status no cambia</text>
      </g>

      <!-- TERMINAL OUTCOMES -->
      <g>
        <rect x="360" y="432" width="240" height="72" rx="8" fill="rgba(34,48,107,0.04)" stroke="#4c5a8f" stroke-width="1.5" stroke-dasharray="3,3"/>
        <rect x="370" y="440" width="56" height="12" rx="2" fill="none" stroke="rgba(76,90,143,0.45)" stroke-width="0.8"/>
        <text x="398" y="449" fill="#4c5a8f" font-size="7" font-family="'Courier Prime', monospace" text-anchor="middle" letter-spacing="0.08em">TERMINAL</text>
        <text x="480" y="460" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">failed</text>
        <text x="480" y="475" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">PDF ilegible · perfil no público</text>
        <text x="480" y="486" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">· filtros de seguridad</text>
        <text x="480" y="497" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">4.º intento: mensaje genérico</text>
      </g>
      <g>
        <rect x="672" y="432" width="240" height="72" rx="8" fill="rgba(34,48,107,0.04)" stroke="#4c5a8f"/>
        <rect x="682" y="440" width="48" height="12" rx="2" fill="none" stroke="rgba(76,90,143,0.45)" stroke-width="0.8"/>
        <text x="706" y="449" fill="#4c5a8f" font-size="7" font-family="'Courier Prime', monospace" text-anchor="middle" letter-spacing="0.08em">LÓGICO</text>
        <text x="792" y="460" fill="#22306b" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">expirado</text>
        <text x="792" y="477" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">TTL Firestore · lifecycle Storage</text>
        <text x="792" y="489" fill="#4c5a8f" font-size="9" font-family="'Courier Prime', monospace" text-anchor="middle">API: 404 «Este roast ya expiró»</text>
      </g>

      <!-- LEGEND · bottom strip -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(34,48,107,0.12)" stroke-width="0.8"/>
      <text x="40" y="558" fill="#4c5a8f" font-size="8" font-family="'Courier Prime', monospace" font-weight="700" letter-spacing="0.16em">LEYENDA</text>
      <g font-family="'Archivo', sans-serif" font-size="9" fill="#4c5a8f">
        <rect x="40" y="570" width="16" height="12" rx="3" fill="#ffffff" stroke="#22306b"/>
        <text x="62" y="580">fase (status)</text>
        <rect x="160" y="570" width="16" height="12" rx="3" fill="#f7faf7" stroke="#4c5a8f" stroke-dasharray="3,2"/>
        <text x="182" y="580">espera</text>
        <rect x="248" y="570" width="16" height="12" rx="3" fill="rgba(34,48,107,0.04)" stroke="#4c5a8f" stroke-width="1.5" stroke-dasharray="2,2"/>
        <text x="270" y="580">terminal</text>
        <path d="M344 570 V576 H388 V570" fill="none" stroke="#a9c2b4" stroke-width="1"/>
        <text x="396" y="580">cualquiera de los tres pasos</text>
        <line x1="552" y1="576" x2="580" y2="576" stroke="#c4232b" stroke-width="1.4" marker-end="url(#estados-arrow-accent)"/>
        <text x="588" y="580">foco: retomar sin repetir</text>
        <line x1="728" y1="576" x2="756" y2="576" stroke="#4c5a8f" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#estados-arrow)"/>
        <text x="764" y="580">paso del tiempo</text>
      </g>
    </svg>
  </div>
</body>
</html>
